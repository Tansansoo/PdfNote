name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 실패 시 오류 발췌를 Job Summary(공개)와 주석으로 남긴다
      - name: Report build errors
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo '```'
            grep -nE '^e: |error:|FAILURE:|What went wrong|Caused by:|Exception|Could not|Unresolved|Execution failed' build.log | head -n 120
            echo '```'
            echo "### Last 150 lines"
            echo '```'
            tail -n 150 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |What went wrong' -A 3 build.log | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PdfNote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfNote-apk
          path: PdfNote.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PdfNote (latest build)
          body: 가장 최근 빌드된 APK입니다. 태블릿에서 PdfNote.apk를 눌러 다운로드 후 설치하세요.
          files: PdfNote.apk
          prerelease: true
